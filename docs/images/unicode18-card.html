<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: KF; src: url("../../fonts/Kureedo-Regular.ttf") format("truetype"); }
  :root { --ink: #17140f; --paper: #ece5d6; --card: #fbf8f1; --rule: #c9bda3; --rule2: #e4dccb; --accent: #a43f1f; --muted: #857a66; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 1600px; height: 900px; background: var(--paper); display: flex; align-items: center; justify-content: center; color: var(--ink); font-family: KF, serif;
         background-image: radial-gradient(var(--rule) .9px, transparent 1px); background-size: 18px 18px; }
  .frame { width: 1520px; height: 820px; background: var(--card); border: 3px solid var(--ink); position: relative; box-shadow: 16px 16px 0 var(--ink); display: grid; grid-template-rows: 64px 1fr 68px; }
  .frame::before { content: ""; position: absolute; inset: 9px; border: 1px solid var(--rule); pointer-events: none; }
  .corner { position: absolute; width: 26px; height: 26px; border: 3px solid var(--accent); pointer-events: none; }
  .c1 { top: -3px; left: -3px; border-right: 0; border-bottom: 0; } .c2 { top: -3px; right: -3px; border-left: 0; border-bottom: 0; }
  .c3 { bottom: -3px; left: -3px; border-right: 0; border-top: 0; } .c4 { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }
  .bar { display: flex; align-items: center; justify-content: space-between; padding: 0 44px; font: 600 19px/1 ui-monospace, monospace; letter-spacing: .22em; }
  .top { border-bottom: 2px solid var(--ink); color: var(--accent); }
  .top .mid { color: var(--muted); font-weight: 500; letter-spacing: .12em; }
  .top .ticks { flex: 1; height: 10px; margin: 0 28px; background: repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px 12px); align-self: end; margin-bottom: 0; }
  .bot { border-top: 2px solid var(--ink); }
  .body { display: grid; grid-template-columns: 1fr 1fr 330px; }
  .char { display: grid; grid-template-rows: 1fr auto auto; padding: 16px 28px 14px; position: relative; }
  .char + .char { border-left: 1px solid var(--rule); }
  .g { font-size: 250px; line-height: 1; display: flex; align-items: center; justify-content: center; position: relative; }
  .g::before { content: ""; position: absolute; width: 270px; height: 270px; border: 1px dashed var(--rule); }
  .g::after { content: ""; position: absolute; width: 270px; height: 1px; background: var(--rule2); }
  .meta { text-align: center; padding-bottom: 12px; }
  .cp { font: 700 32px/1 ui-monospace, monospace; letter-spacing: .05em; }
  .nm { font: 500 15px/1.4 ui-monospace, monospace; color: var(--muted); letter-spacing: .12em; margin-top: 8px; }
  .cmp { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule); padding-top: 10px; text-align: center; }
  .cmp div { position: relative; }
  .cmp div + div::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; border-left: 1px solid var(--rule2); }
  .cmp .k { font-size: 84px; line-height: 1.1; }
  .cmp .k.kj { color: var(--muted); }
  .cmp .l { font: 500 13px/1.3 ui-monospace, monospace, KF; color: var(--muted); letter-spacing: .08em; }
  .cmp .l i { font: 400 15px KF, serif; }
  .cmp .l b { color: var(--ink); font-weight: 700; }
  .side { border-left: 2px solid var(--ink); display: grid; grid-template-rows: auto 1fr; }
  .side h3 { margin: 0; padding: 12px 0 10px; text-align: center; font: 600 14px/1 ui-monospace, monospace; letter-spacing: .2em; color: var(--muted); border-bottom: 1px solid var(--rule); }
  .cols { display: flex; justify-content: center; gap: 22px; padding: 22px 0 0; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .col .tag { font: 600 12px/1 ui-monospace, monospace; letter-spacing: .18em; color: var(--accent); writing-mode: vertical-rl; }
  .col p { writing-mode: vertical-rl; font-size: 31px; line-height: 1.7; margin: 0; letter-spacing: .1em; height: 540px; }
  .bot .s { font: 400 28px KF, serif; letter-spacing: .1em; }
  .bot .s small { font: 600 12px/1 ui-monospace, monospace; letter-spacing: .2em; color: var(--accent); margin-right: 14px; vertical-align: 6px; }
  .bot .brand { font: 600 16px/1 ui-monospace, monospace; letter-spacing: .3em; color: var(--muted); }
</style>

    <span class="brand">KUREEDO</span>

</div>
