name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build.py
      - run: python scripts/check.py
      - run: git diff --exit-code --stat -- fonts/KureedoKata-Regular.woff2 || (echo "committed webfont differs from the build" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: |
            fonts/
            OFL.txt
